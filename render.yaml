services:
  - type: web
    name: resonance-room-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: python -m pip install --require-hashes -r requirements.lock
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false

  - type: web
    name: resonance-room-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
